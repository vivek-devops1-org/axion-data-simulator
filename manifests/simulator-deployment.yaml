apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: vivek
spec:
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
      - name: simulator
        image: clusteraliregistry.azurecr.io/axion-simulator:v2
        ports:
        - containerPort: 8000
